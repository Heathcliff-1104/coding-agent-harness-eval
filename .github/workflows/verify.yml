name: Verify candidate snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: [mini, dsh, pi]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: candidates/${{ matrix.candidate }}/backend
        run: mvn --batch-mode test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidates/${{ matrix.candidate }}/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: candidates/${{ matrix.candidate }}/frontend
        run: npm ci

      - name: Build frontend
        working-directory: candidates/${{ matrix.candidate }}/frontend
        run: npm run build
