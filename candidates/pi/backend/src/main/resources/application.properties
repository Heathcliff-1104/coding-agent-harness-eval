server.port=8080

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Spring MVC 路径匹配策略（修复 knife4j/springfox 在 Boot 2.6+ 的 NPE）
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# SQL 初始化（schema.sql / data.sql，幂等）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# Mybatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.koolearn.bms.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging.level.root=INFO
logging.level.com.koolearn.bms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/bms.log
logging.file.max-size=50MB
logging.file.max-history=30

# 钉钉配置
dingtalk.app.key=${DINGTALK_APP_KEY:demo-key}
dingtalk.app.secret=${DINGTALK_APP_SECRET:demo-secret}
dingtalk.corp.id=${DINGTALK_CORP_ID:demo-corp}
dingtalk.agent.id=${DINGTALK_AGENT_ID:0}
dingtalk.inbound.process-code=${DINGTALK_INBOUND_PROCESS_CODE:demo-inbound}
dingtalk.outbound.process-code=${DINGTALK_OUTBOUND_PROCESS_CODE:demo-outbound}
dingtalk.originator.user-id=${DINGTALK_ORIGINATOR_USER_ID:demo-user}
dingtalk.dept.id=${DINGTALK_DEPT_ID:demo-dept}
# 钉钉回调验签 Token
dingtalk.callback.token=${DINGTALK_CALLBACK_TOKEN:demo-callback-token}
# 钉钉消息模式：mock=仅记录日志，robot=推送到机器人 webhook
dingtalk.mode=${DINGTALK_MODE:mock}
dingtalk.webhook.url=${DINGTALK_WEBHOOK_URL:}

# 业务配置
# 管理员重置密码时使用的默认密码（满足 8-20 位、≥3 类字符的密码策略）
sys.default.password=${DEFAULT_PASSWORD:Sys@123456}
# 系统日志保留天数，超过自动清理
sys.log.retention.days=${SYS_LOG_RETENTION_DAYS:365}

# CIS 元件库同步
# cis.mode=mock 时仅记录日志不调用外部服务
cis.mode=${CIS_SYNC_MODE:mock}
cis.url=${CIS_SYNC_URL:http://localhost:9090/cis}

# Swagger
knife4j.enable=true
