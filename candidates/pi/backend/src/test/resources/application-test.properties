# 测试环境使用 H2 内存数据库（MySQL 兼容模式）
spring.datasource.url=jdbc:h2:mem:bms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL 初始化（schema.sql / data.sql）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# 关闭文件日志，避免测试产生日志文件
logging.file.name=

# MyBatis-Plus 关闭 SQL 日志
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.koolearn.bms.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 测试时固定业务配置
dingtalk.callback.token=test-callback-token
sys.default.password=Test@123456
sys.log.retention.days=365
dingtalk.mode=mock
dingtalk.webhook.url=
cis.mode=mock
cis.url=http://localhost:9090/cis
