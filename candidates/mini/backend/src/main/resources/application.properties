server.port=8080

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 自动初始化 schema（幂等 CREATE TABLE IF NOT EXISTS）
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Mybatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.koolearn.bms.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging.level.root=INFO
logging.level.com.koolearn.bms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/bms.log
logging.file.max-size=50MB
logging.file.max-history=30

# JWT 配置（生产环境必须通过环境变量 JWT_SECRET 提供强随机密钥，长度>=32）
bms.jwt.secret=${JWT_SECRET:local-evaluation-jwt-secret-change-me-123456789}
bms.jwt.expire-days=7
# 置为 true 时，若仍在使用默认密钥则启动失败
bms.jwt.strict=${BMS_JWT_STRICT:false}

# 前端 CORS 允许来源（逗号分隔），默认放行本地开发
bms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 钉钉回调签名密钥（用于校验钉钉审批回调；未配置时仅放行演示模式）
dingtalk.callback.secret=${DINGTALK_CALLBACK_SECRET:}

# 钉钉配置
dingtalk.app.key=${DINGTALK_APP_KEY:demo-key}
dingtalk.app.secret=${DINGTALK_APP_SECRET:demo-secret}
dingtalk.corp.id=${DINGTALK_CORP_ID:demo-corp}
dingtalk.agent.id=${DINGTALK_AGENT_ID:0}
dingtalk.inbound.process-code=${DINGTALK_INBOUND_PROCESS_CODE:demo-inbound}
dingtalk.outbound.process-code=${DINGTALK_OUTBOUND_PROCESS_CODE:demo-outbound}
dingtalk.originator.user-id=${DINGTALK_ORIGINATOR_USER_ID:demo-user}
dingtalk.dept.id=${DINGTALK_DEPT_ID:demo-dept}

# CIS 适配器配置
cis.adapter.mode=${CIS_ADAPTER_MODE:mock}
cis.adapter.base-url=${CIS_BASE_URL:http://localhost:9080}
cis.adapter.token=${CIS_TOKEN:}

# Swagger
knife4j.enable=true
