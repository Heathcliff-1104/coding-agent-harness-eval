server.port=8080

# springfox(Knife4j) 在 Spring Boot 2.6+ 下需要 ant 匹配策略才能生成 /v2/api-docs
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bms?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 首次启动自动执行建库脚本（schema.sql 内含 CREATE DATABASE IF NOT EXISTS + CREATE TABLE IF 幂等写法见下）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Mybatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.koolearn.bms.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging.level.root=INFO
logging.level.com.koolearn.bms=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/bms.log
logging.file.max-size=50MB
logging.file.max-history=30

# 钉钉配置
dingtalk.app.key=${DINGTALK_APP_KEY:demo-key}
dingtalk.app.secret=${DINGTALK_APP_SECRET:demo-secret}
dingtalk.corp.id=${DINGTALK_CORP_ID:demo-corp}
dingtalk.agent.id=${DINGTALK_AGENT_ID:0}
dingtalk.inbound.process-code=${DINGTALK_INBOUND_PROCESS_CODE:demo-inbound}
dingtalk.outbound.process-code=${DINGTALK_OUTBOUND_PROCESS_CODE:demo-outbound}
dingtalk.originator.user-id=${DINGTALK_ORIGINATOR_USER_ID:demo-user}
dingtalk.dept.id=${DINGTALK_DEPT_ID:demo-dept}

# 允许的前端来源（CORS），逗号分隔；生产环境改为实际前端域名
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 演示模式：当 app.key=demo-key 时自动启用（不调用真实钉钉）；生产环境设置 dingtalk.mock.enabled=false
dingtalk.mock.enabled=${DINGTALK_MOCK_ENABLED:false}
# 钉钉机器人Webhook（通知用）；留空时通知仅写日志
dingtalk.notify.webhook=${DINGTALK_NOTIFY_WEBHOOK:}

# CIS元件库同步地址（示例 CIS 元件库）；空/演示模式下为模拟同步
cis.endpoint=${CIS_ENDPOINT:}

# Swagger（生产环境建议关闭）
knife4j.enable=${KNIFE4J_ENABLE:true}
